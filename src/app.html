<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon-small.png" />
        <!-- Link previews. %og.*% are filled per request in src/hooks.server.js;
             each page sets its own og:title/og:description via PageMeta.svelte. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Siven Panda" />
        <meta property="og:url" content="%og.url%" />
        <meta property="og:image" content="%og.image%" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="A photograph by Siven Panda with the SP logo" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="%og.image%" />
        <link
            rel="preload"
            href="%sveltekit.assets%/fonts/MozillaHeadline-Variable.woff"
            as="font"
            type="font/woff"
            crossorigin
        />
        <link
            rel="preload"
            href="%sveltekit.assets%/fonts/MozillaText-Variable.woff"
            as="font"
            type="font/woff"
            crossorigin
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        %sveltekit.head%
    </head>
    <body id="global-body" data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>

<style>
    html,
    body {
        font-family: 'Mozilla Text';
        max-width: 100vw;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: rgb(11, 11, 26);
        color: white;
        min-height: 100vh;
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    img,
    svg {
        max-width: 100%;
    }

    @-moz-document url-prefix() {
        html {
            overflow-x: hidden;
            overflow-y: auto;
        }
        body {
            overflow: visible;
        }
    }

    @font-face {
        font-family: 'Mozilla Headline';
        src: url('./fonts/MozillaHeadline-Variable.woff') format('woff');
        font-weight: 125 950;
    }

    @font-face {
        font-family: 'Mozilla Text';
        src: url('./fonts/MozillaText-Variable.woff') format('woff');
        font-weight: 125 950;
    }

    :root {
        --p-size: clamp(1em, 0.7vw + 0.4rem, 1.1em);
    }

    @media (max-width: 480px) {
        :root {
            --p-size: 0.95rem;
        }
    }

    h1,
    h2,
    h3 {
        font-family: 'Mozilla Headline', 'serif';
    }

    p {
        font-family: 'Mozilla Text', 'sans-serif';
        font-weight: 250;
        font-size: var(--p-size);
    }
</style>
<script src="https://kit.fontawesome.com/07f5345973.js" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
